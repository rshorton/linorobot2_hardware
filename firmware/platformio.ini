; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = teensy
framework = arduino
upload_port = /dev/ttyACM0
upload_protocol = teensy-cli
board_microros_transport = native_ethernet
board_microros_distro = jazzy
build_flags = -I ../config
	-D ELSABOT
	-D USE_ETHERNET
	-Wno-unused-result
	'-D LOCAL_MAC={ 0xAA, 0xBB, 0xCC, 0xEE, 0xDD, 0xFF }'
	'-D LOCAL_IP={ 192, 168, 2, 101 }'
	'-D AGENT_IP={ 192, 168, 2, 100 }'

[env:teensy41]
board = teensy41
board_microros_user_meta = micro_ros.meta
lib_deps = 
	arduino-libraries/Stepper@^1.1.3
	https://github.com/micro-ROS/micro_ros_platformio/
	waspinator/AccelStepper@^1.64
	https://github.com/rshorton/Adafruit_VL53L7.git
	stm32duino/STM32duino VL53L7CX@^1.0.3
	robtillaart/PCF8575@^0.3.0
